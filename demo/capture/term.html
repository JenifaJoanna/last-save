<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>terminal replay</title>
<link rel="stylesheet" href="node_modules/asciinema-player/dist/bundle/asciinema-player.css" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet" />
<style>
  /* The Last Save terminal palette (film spec): ink #120e22, text #efe5d0, gold prompt, green ok, red fail. */
  html, body { margin: 0; height: 100%; background: #0a0814; }
  body { display: grid; place-items: center; }
  .win { width: 1800px; height: 980px; border-radius: 20px; overflow: hidden; border: 1px solid rgba(0,0,0,0.6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 40px 120px rgba(0,0,0,0.7); background: #1b1630; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; }
  .screen { flex: 1; border-radius: 14px; overflow: hidden; background: #120e22; display: flex; flex-direction: column; position: relative; }
  .bar { height: 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 22px; background: #ff6b2b; color: #160b05; font: 700 15px "Chakra Petch", sans-serif; letter-spacing: 0.16em; text-transform: uppercase; }
  .bar span:last-child { justify-self: end; }
  #player { flex: 1; padding: 18px 26px; }
  .scan { position: absolute; inset: 40px 0 0; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  .ap-wrapper, .ap-player, .ap-terminal { background: #120e22 !important; }
  .ap-terminal { font-family: "IBM Plex Mono", ui-monospace, monospace !important; color: #efe5d0 !important; }
  .ap-control-bar { display: none !important; }
  /* asciinema "theme" colours mapped to the terminal palette */
  .ap-player { --term-color-foreground: #efe5d0; --term-color-background: #120e22; --term-color-1: #ff4d5e; --term-color-2: #45e394; --term-color-3: #ffc94a; --term-color-4: #9b8fd0; --term-color-5: #e8407e; --term-color-6: #4fd8d0; --term-color-7: #efe5d0; --term-color-9: #ff4d5e; --term-color-10: #45e394; --term-color-11: #ffc94a; --term-color-14: #4fd8d0; --term-color-15: #ffffff; }
</style>
</head>
<body>
  <div class="win">
    <div class="screen">
      <div class="bar"><span>LS-0001 · Terminal</span><span id="title">Fan host</span><span id="clock"></span></div>
      <div id="player"></div>
      <div class="scan"></div>
    </div>
  </div>
  <script src="node_modules/asciinema-player/dist/bundle/asciinema-player.min.js"></script>
  <script>
    // Replays a real asciinema recording (?cast=file.cast) at real speed, idle gaps capped (?idle=seconds).
    // Casts are recorded at 96x26 with prompt "$ " (no host or user) and no secrets on screen.
    const q = new URLSearchParams(location.search);
    document.getElementById("title").textContent = q.get("title") || "Fan host";
    document.getElementById("clock").textContent = new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", hour12: false }) + " · " + (q.get("status") || "Online");
    AsciinemaPlayer.create(q.get("cast"), document.getElementById("player"), {
      autoPlay: true, fit: "both", terminalFontSize: "26px", idleTimeLimit: Number(q.get("idle") || 2), speed: Number(q.get("speed") || 1),
      theme: "asciinema", controls: false, cols: 96, rows: 26,
    });
  </script>
</body>
</html>
