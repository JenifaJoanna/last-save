[package]
name = "mock-outlayer"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
license = "MIT"
description = "Test double for outlayer.testnet: returns pre-configured execution output and records store_secrets."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
