[package]
name = "lastsave-factory"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
license = "MIT"
description = "Last Save studio factory: creates a born-locked licence instance (no access keys) that runs a global contract identified by its immutable code hash (NEP-591)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5", features = ["global-contracts"] }

[dev-dependencies]
near-sdk = { version = "5", features = ["global-contracts", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
