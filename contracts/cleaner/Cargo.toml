[package]
name = "lastsave-cleaner"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
license = "MIT"
description = "Wipes a dev contract's storage so the same account can be re-initialised. Only the account itself can call it."

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
