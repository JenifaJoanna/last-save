[package]
name = "lastsave-sandbox-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "near-workspaces sandbox lifecycle test for the Last Save licence against a mock OutLayer."

[dependencies]

[dev-dependencies]
near-workspaces = "0.22"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
sha3 = "0.10"
near-primitives = "0.36.0"
near-crypto = "0.36.0"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
hex = "0.4"
