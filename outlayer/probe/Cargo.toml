[package]
name = "lastsave-probe"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Last Save probe program: runs inside OutLayer's TEE and decides whether a game server is really serving licence holders (NEP-413 logins, session receipts, on-chain key and licence checks)."

[lib]
name = "lastsave_probe"
path = "src/lib.rs"

[[bin]]
name = "lastsave-probe"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

# The WASI HTTP binding is only built for the wasm target, so the logic crate
# tests on the host. wasi-http-client is not used: it exposes no first-byte or
# between-bytes timeout, and a dead server that stalls must not stall the probe.
[target.'cfg(target_os = "wasi")'.dependencies]
wasi = "0.13"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
